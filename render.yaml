services:
  - type: web
    name: tripwire-server
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install && npx prisma generate
    startCommand: npx prisma db push --skip-generate && npm run seed && npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tripwire-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production

databases:
  - name: tripwire-db
    plan: free
